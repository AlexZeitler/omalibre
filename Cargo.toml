[package]
name = "omalibre"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Terminal ebook reader with a library, annotations and Omarchy theming"
repository = "https://github.com/AlexZeitler/omalibre"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2.189"
ratatui = { version = "0.30.2", features = ["underline-color"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.4"
unicode-width = "0.2.2"
# EPUB permits stored and deflated entries only, so the other compressors are
# left out. They pull in C libraries, which would otherwise force a C toolchain
# on anyone building the reader and stand in the way of a static binary.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
